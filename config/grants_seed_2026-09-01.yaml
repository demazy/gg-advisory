  description: The R&D Tax Incentive is a legislated program that offsets some costs of eligible research and development
    that companies might not otherwise undertake. It is open across industry sectors and company sizes, subject to the R&D
    entity and activity rules.
  why_it_matters: It can support qualifying climate-tech R&D alongside commercialisation funding. It is particularly relevant
    where technical experimentation, prototyping and supporting activities are central to the company’s development plan.
  signals: The official programme landing page states that 2026–27 Budget changes are scheduled to start on 1 July 2028; until
    then, the program continues under current rules.
