grants:
- id: energylab-accelerator-2026
  name: EnergyLab Climate Solutions Accelerator 2026
  admin: EnergyLab
  level: national
  type: accelerator
  amount: $80,000–$100,000 equity investment per accepted startup
  deadline: '2026-03-15'
  deadline_type: fixed
  deadline_label: 15 March 2026
  target_stage: Early-stage to growth-stage
  url: https://energylab.org.au/programs/acceleration/
  description: 'Australia''s largest cleantech accelerator offers early-stage and growth-stage climate-tech companies $80,000–$100,000
    equity investment plus access to EnergyLab''s investor network, mentors, and corporate partners. The 2026 cohort runs
    May–October. Any Australian startup is eligible; no sector restriction within climate/clean energy.

    '
  why_it_matters: 'Australia''s highest-profile pathway for climate-tech founders seeking institutional backing and market
    entry. First-round interviews run 6–24 April 2026 for shortlisted applicants.

    '
  signals: 'EnergyLab also runs a separate Scaleup Program for later-stage companies (June–October 2026, non-dilutive); applications
    remain open after the accelerator closes.

    '
  show_from: '2026-01-01'
  show_until: '2026-03-31'
- id: act-icon-grant-2026
  name: ACT Innovation Connect (ICON) Grant
  admin: Canberra Innovation Network (CBRIN) / ACT Government
  level: act
  type: grant
  amount: $10,000–$30,000 matched (dollar-for-dollar)
  deadline: '2026-04-10'
  deadline_type: fixed
  deadline_label: 10 April 2026 (EOI)
  target_stage: Early-stage; concept to market-ready (turnover under $2M)
  url: https://cbrin.com.au/icon/
  description: 'The ACT Government''s Innovation Connect grant provides $10,000–$30,000 in matched funding to early-stage
    Canberra-based businesses. Eligible costs include prototyping, market testing, IP/legal and commercialisation activities.
    The EOI round closes 10 April 2026.

    '
  why_it_matters: 'One of the few grants with a firm April deadline. Climate-tech founders based in or willing to establish
    in the ACT should apply immediately.

    '
  show_from: '2026-01-01'
  show_until: '2026-04-30'
- id: nsw-etcf-2026
  name: NSW Emerging Technology Commercialisation Fund (ETCF) 2026
  admin: NSW Office of the Chief Scientist and Engineer
  level: nsw
  type: repayable_grant
  amount: $500,000–$2,000,000 per project (repayable grant; $20M pool)
  deadline: '2026-04-29'
  deadline_type: fixed
  deadline_label: 29 April 2026, 10:00 AM AEST
  target_stage: TRL 3–7; deep-tech commercialisation
  url: https://chiefscientist.smartygrants.com.au/ETCF2026
  description: 'The NSW Office of the Chief Scientist and Engineer offers $500,000–$2M per project from a $20M pool. Priority
    sectors include net-zero technologies, local manufacturing, and housing innovation. Funding is a repayable grant (repayment
    triggered when EBITDA exceeds $500K). Matched funding required. Full applications due July 2026; outcomes October 2026.

    '
  why_it_matters: 'One of the largest state-level deep-tech commercialisation grants in Australia this year. Apply via SmartyGrants
    — the expression of interest stage closes 29 April.

    '
  show_from: '2026-03-01'
  show_until: '2026-04-30'
- id: energylab-scaleup-2026
  name: EnergyLab Scaleup Program 2026
  admin: EnergyLab
  level: national
  type: accelerator
  amount: Non-dilutive; structured 3-module program
  deadline: null
  deadline_type: rolling
  deadline_label: Open now — program runs June–October 2026
  target_stage: Scale-up; startups ready to deploy technology commercially
  url: https://energylab.org.au/programs/scaleup/
  description: 'EnergyLab''s non-dilutive Scaleup Program runs June–October 2026 across three structured modules, culminating
    in a public showcase at the AllEnergy Conference in October 2026. Designed for startups and energy companies with market-ready
    technology seeking to accelerate commercial deployment. Applications are currently open.

    '
  why_it_matters: 'An ideal companion to the Climate Solutions Accelerator for later-stage founders. Non-dilutive and free
    to apply — the AllEnergy showcase provides direct access to energy sector buyers.

    '
  show_from: '2026-03-01'
  show_until: '2026-07-31'
- id: wa-ceff-round4
  name: 'WA: Clean Energy Future Fund — Round 4'
  admin: Department of Water and Environmental Regulation (DWER) / Energy Policy WA
  level: wa
  type: grant
  amount: $100,000–$4,000,000 per project (from $9M pool)
  deadline: '2026-04-20'
  deadline_type: fixed
  deadline_label: 20 April 2026
  target_stage: Any stage; incorporated Australian entity with ABN
  url: https://www.wa.gov.au/service/environment/environment-information-services/clean-energy-future-fund
  description: 'The WA Government''s $9 million Round 4 provides grants of $100,000–$4,000,000 for clean energy projects that
    reduce greenhouse gas emissions. Priority areas include decarbonisation of heavy industry, long-duration energy storage,
    green exports, renewable energy supply, and projects with demonstrated benefits to First Nations peoples. Part of a $37M
    total CEFF commitment to 2030–31. Co-contribution required; exact ratio varies by project.

    '
  why_it_matters: 'The largest competitive clean energy grant currently open in WA. Well-suited for startups with deployable
    technology in energy storage, electrification, or renewable manufacturing seeking first in-market project funding.

    '
  show_from: '2026-01-01'
  show_until: '2026-04-30'
- id: vic-circular-economy-rmf-r6
  name: 'VIC: Circular Economy Recycling Modernisation Fund — Round 6'
  admin: Sustainability Victoria (SV)
  level: vic
  type: grant
  amount: From $6M pool; co-contribution ratio 1:2 SV:applicant (for-profit businesses)
  deadline: '2026-07-01'
  deadline_type: fixed
  deadline_label: 1 July 2026 midnight AEST
  target_stage: SME to established business; recycling, resource recovery, circular economy
  url: https://www.sustainability.vic.gov.au/grants-funding-and-investment/grants-and-funding/victorian-circular-economy-recycling-modernisation-fund
  description: 'Sustainability Victoria''s Round 6 opens $6 million for capital investment in recycling infrastructure, remanufacturing,
    and resource recovery. For-profit applicants must co-contribute $2 for every $1 of SV funding; local government and not-for-profits
    match 1:1. Applications submitted via SmartyGrants. Note: Sustainability Victoria is scheduled to be abolished in 2026
    following the Silver Review — this may be one of its final grant rounds.

    '
  why_it_matters: 'A critical window for Victorian cleantech businesses in the circular economy space, especially given SV''s
    likely abolition. The 1:2 co-contribution requirement means applicants need substantial internal capital or co-investors
    lined up before applying.

    '
  signals: 'With SV''s abolition flagged for 2026, monitor the Victorian Government for announcements on which agency will
    absorb the circular economy grant function post-SV.

    '
  show_from: '2026-03-01'
  show_until: '2026-07-31'
