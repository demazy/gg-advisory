  amount: $5 billion in concessional finance
  deadline: null
  deadline_type: rolling
  deadline_label: Open for applications via the NRFC Net Zero Fund webform; no fixed deadline is published.
  target_stage: Large industrial firms and domestic low-emissions-technology manufacturers; the fund can support earlier-stage
    proposals, first-of-a-kind projects, and projects with large upfront capital needs or longer repayment periods.
  url: https://nrf.gov.au/what-we-do/investment-sub-funds/net-zero-fund
  description: The $5 billion Net Zero Fund is an NRFC sub-fund for decarbonising energy-intensive industrial operations and
    scaling domestic manufacturing of low-emissions technologies. It is designed to support earlier-stage and first-of-a-kind
    proposals, as well as projects with large upfront capital requirements or longer repayment periods. Applicants register
    interest through the NRFC webform and are then contacted by investment professionals about eligibility and lodging an
    investment proposal.
  why_it_matters: This is a large national concessional-finance pathway specifically aimed at industrial decarbonisation and
    low-emissions manufacturing scale-up. It is especially relevant where conventional finance is constrained by technology,
    capital-intensity or project-duration risk.
  signals: The current official page states that the Net Zero Fund is open for applications. Current investment guidance states
    that the Net Zero Fund has a benchmark return of the 5-year Australian Government Bond minus 1%, distinguishing it from
    the General Portfolio.
