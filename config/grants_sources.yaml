scope:
  definition: Australian national, state and territory funding pathways materially relevant to climate-tech founders, technology
    developers, research spin-outs, clean-energy and industrial-decarbonisation ventures, clean manufacturing, circular-economy
    technology businesses and investors. Include grants, commercialisation programmes, accelerators, equity investment and
    concessional debt/equity pathways that are current, opening soon, recurring, or recently closed but materially worth monitoring.
    General deep-tech/start-up programmes are included only when they provide direct cash/equity or substantial structured
    commercialisation support and have explicit climate-tech, clean-energy, sustainability, advanced-manufacturing or research-commercialisation
    fit. Exclude household/consumer rebates, ordinary procurement/tenders, awards or competitions without material venture
    funding, generic training, community-only grants, academic fellowships without a venture-commercialisation pathway, routine
    energy-efficiency rebates for standard equipment, and old historical rounds with no explicit recurrence or successor relevance.
    Local-government-only grants are outside the core radar unless they are surfaced by a mandatory national/state discovery
    catalogue or are material enough to be explicitly added to the monitored source universe.
  funding_terms:
  - grant
  - funding
  - accelerator
  - incubator
  - investment
  - equity
  - concessional
  - tax offset
  - commercialisation
  - co-investment
  - venture
  climate_terms:
  - climate
  - clean energy
  - renewable
  - net zero
  - low emissions
  - decarbonisation
  - circular economy
  - recycling
  - hydrogen
  - battery
  - solar
  - green metals
  - sustainable fuel
  - energy transition
  - critical minerals
  - energytech
  - cleantech
  venture_terms:
  - startup
  - start-up
  - SME
  - business
  - venture
  - technology
  - research
  - commercialisation
  - manufacturer
  - founder
  - scaleup
  - spin-out
