name: grants-radar-audited

on:
  # Manual only while the audit pipeline is being validated.
  # Uncomment later if you want an automatic run on the 1st of each month.
  # schedule:
  #   - cron: "10 0 1 * *" # 00:10 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grants-radar-audited
  cancel-in-progress: false

jobs:
  verify-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Preflight audited package version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expected = "3.1-web-search"
          checks = {
              "src/grants_core.py": [f'PIPELINE_VERSION = "{expected}"', '"type": "web_search"', '"allowed_domains": allowed', 'web_search_call.action.sources'],
              "src/update_grants.py": [f'PIPELINE_VERSION = "{expected}"', "discover_programmes_via_web", "extract_program_via_web", "discovery=responses-web-search"],
              "src/audit_grants.py": [f'PIPELINE_VERSION = "{expected}"', "independent_validate_via_web", "audit=independent-responses-web-search"],
              "tests/test_workflow_fail_closed.py": ["test_workflow_uses_separate_web_discovery_and_audit_models"],
          }
          failures = []
          for name, markers in checks.items():
              p = Path(name)
              if not p.exists():
                  failures.append(f"missing:{name}")
                  continue
              text = p.read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      failures.append(f"wrong_version_or_missing_marker:{name}:{marker}")
          if failures:
              raise SystemExit("AUDITED PACKAGE PREFLIGHT FAILED\n" + "\n".join(failures))
          print(f"Audited package preflight PASS: {expected}")
          PY
          echo "Critical file fingerprints:"
          sha256sum \
            src/grants_core.py \
            src/update_grants.py \
            src/audit_grants.py \
            config/grants_sources.yaml \
            tests/test_grants_audit.py \
            tests/test_grants_audit_strict.py \
            tests/test_workflow_fail_closed.py

      - name: Install verification and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 trafilatura PyYAML pymupdf reportlab pytest
          python -m py_compile \
            src/grants_core.py \
            src/update_grants.py \
            src/audit_grants.py \
            src/build_grants_pdf.py

      - name: Run deterministic audit unit tests
        run: pytest -q tests

      - name: Resolve current Melbourne report date
        id: when
        shell: bash
        run: |
          set -euo pipefail
          YM="$(TZ=Australia/Melbourne date +%Y-%m)"
          VERIFIED="$(TZ=Australia/Melbourne date +%Y-%m-%d)"
          MONTH_NAME="$(TZ=Australia/Melbourne date +%B-%Y)"
          PDF="out/Australia-Climate-Tech-Funding-Radar-${MONTH_NAME}-GG-Advisory.pdf"
          AUDIT_JSON="out/grants-audit-${VERIFIED}.json"
          AUDIT_MD="out/grants-audit-${VERIFIED}.md"
          echo "ym=$YM" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"
          echo "audit_json=$AUDIT_JSON" >> "$GITHUB_OUTPUT"
          echo "audit_md=$AUDIT_MD" >> "$GITHUB_OUTPUT"
          echo "Report month: $YM"
          echo "Verification date: $VERIFIED"

      - name: Discover and verify funding pathways
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRANTS_WEB_MODEL: "gpt-5.6-luna"
          GRANTS_WEB_AUDIT_MODEL: "gpt-5.6-terra"
          GRANTS_WEB_WORKERS: "3"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python src/update_grants.py \
            --input config/grants.yaml \
            --sources config/grants_sources.yaml \
            --output out/grants-verified-candidate.yaml \
            --evidence out/grants-evidence.json \
            --candidates out/grants-candidates.json \
            --coverage out/grants-source-coverage.json \
            --verified "${{ steps.when.outputs.verified }}"

      - name: Independent adversarial audit
        id: audit
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GRANTS_WEB_MODEL: "gpt-5.6-luna"
          GRANTS_WEB_AUDIT_MODEL: "gpt-5.6-terra"
          GRANTS_WEB_AUDIT_WORKERS: "3"
        shell: bash
        run: |
          set -euo pipefail
          python src/audit_grants.py \
            --grants out/grants-verified-candidate.yaml \
            --sources config/grants_sources.yaml \
            --evidence out/grants-evidence.json \
            --candidates out/grants-candidates.json \
            --coverage out/grants-source-coverage.json \
            --verified "${{ steps.when.outputs.verified }}" \
            --output-json "${{ steps.when.outputs.audit_json }}" \
            --output-md "${{ steps.when.outputs.audit_md }}"

      - name: Upload audit evidence even when audit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grants-radar-audit-${{ steps.when.outputs.verified }}
          path: |
            out/grants-verified-candidate.yaml
            out/grants-evidence.json
            out/grants-candidates.json
            out/grants-source-coverage.json
            ${{ steps.when.outputs.audit_json }}
            ${{ steps.when.outputs.audit_md }}
          if-no-files-found: warn
          retention-days: 90

      - name: Hard publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.audit.outcome }}" = "success" || {
            echo "ERROR: independent grants audit failed. PDF will NOT be generated or emailed."
            exit 1
          }
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("${{ steps.when.outputs.audit_json }}")
          d = json.loads(p.read_text())
          if not d.get("publishable"):
              raise SystemExit("ERROR: audit JSON is not publishable")
          print("Audit gate PASS")
          print(d.get("summary", {}))
          PY

      - name: Finalise verified grants configuration
        shell: bash
        run: |
          set -euo pipefail
          cp out/grants-verified-candidate.yaml config/grants.yaml
          python - <<'PY'
          import hashlib, json, yaml
          from pathlib import Path
          audit_path = Path("${{ steps.when.outputs.audit_json }}")
          audit = json.loads(audit_path.read_text())
          p = Path("config/grants.yaml")
          d = yaml.safe_load(p.read_text()) or {}
          d.setdefault("metadata", {})
          d["metadata"]["verification_status"] = "PASS"
          d["metadata"]["verified_date"] = audit["verified_date"]
          d["metadata"]["audit_sha256"] = hashlib.sha256(audit_path.read_bytes()).hexdigest()
          p.write_text(yaml.safe_dump(d, allow_unicode=True, sort_keys=False, width=120), encoding="utf-8")
          PY

      - name: Build audited Grants & Accelerators Radar PDF
        shell: bash
        run: |
          set -euo pipefail
          python src/build_grants_pdf.py \
            config/grants.yaml \
            "${{ steps.when.outputs.ym }}" \
            --audit-report "${{ steps.when.outputs.audit_json }}" \
            --output "${{ steps.when.outputs.pdf }}" \
            --logo assets/gg-advisory-logo.png
          test -s "${{ steps.when.outputs.pdf }}"

      - name: Upload final Radar PDF
        uses: actions/upload-artifact@v4
        with:
          name: grants-radar-${{ steps.when.outputs.ym }}
          path: ${{ steps.when.outputs.pdf }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit verified data, audit and PDF
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "content-bot"
          git config user.email "content-bot@example.com"
          git add -f config/grants.yaml
          git add -f "${{ steps.when.outputs.audit_json }}"
          git add -f "${{ steps.when.outputs.audit_md }}"
          git add -f "${{ steps.when.outputs.pdf }}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "grants: verified radar ${{ steps.when.outputs.ym }}"
            git push origin HEAD:main
          fi

      - name: Email audited Grants & Accelerators Radar PDF
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GG Advisory | Grants & Accelerators Radar (${{ steps.when.outputs.ym }})"
          from: "GG Advisory <${{ secrets.MAIL_USERNAME }}>"
          to: "a.demazy_de_fortet@icloud.com"
          body: |
            Audited Grants & Accelerators Radar for ${{ steps.when.outputs.ym }} attached.

            Publication gate passed:
            - all published programme records independently verified against live primary/administering-body sources
            - all mandatory official-domain source searches completed
            - every jurisdiction independently cross-checked
            - zero unresolved discovery candidates
            - zero unresolved source contradictions
          attachments: |
            ${{ steps.when.outputs.pdf }}
