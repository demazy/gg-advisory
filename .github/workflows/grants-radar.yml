name: grants-radar-audited

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grants-radar-audited
  cancel-in-progress: false

jobs:
  verify-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deterministic verification and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 trafilatura PyYAML pymupdf reportlab pytest

      - name: Verify snapshot-sentinel zero-API package
        shell: bash
        run: |
          set -euo pipefail
          python src/preflight_grants.py
          python -m py_compile \
            src/grants_core.py \
            src/grants_history.py \
            src/update_grants.py \
            src/audit_grants.py \
            src/build_grants_pdf.py \
            src/check_pdf_layout.py \
            src/preflight_grants.py

      - name: Run deterministic and failure-replay tests
        run: pytest -q tests/grants_radar

      - name: Resolve Melbourne report date
        id: when
        shell: bash
        run: |
          set -euo pipefail
          YM="$(TZ=Australia/Melbourne date +%Y-%m)"
          VERIFIED="$(TZ=Australia/Melbourne date +%Y-%m-%d)"
          MONTH_NAME="$(TZ=Australia/Melbourne date +%B-%Y)"
          PDF="out/Australia-Climate-Tech-Funding-Radar-${MONTH_NAME}-GG-Advisory.pdf"
          AUDIT_JSON="out/grants-audit-${VERIFIED}.json"
          AUDIT_MD="out/grants-audit-${VERIFIED}.md"
          LAYOUT_JSON="out/grants-layout-audit-${VERIFIED}.json"
          echo "ym=$YM" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"
          echo "audit_json=$AUDIT_JSON" >> "$GITHUB_OUTPUT"
          echo "audit_md=$AUDIT_MD" >> "$GITHUB_OUTPUT"
          echo "layout_json=$LAYOUT_JSON" >> "$GITHUB_OUTPUT"

      - name: Official-source verification with fresh-snapshot resilience and discovery delta
        id: verify
        continue-on-error: true
        env:
          GRANTS_MAX_HTTP_REQUESTS: "120"
          GRANTS_HTTP_RETRIES: "1"
          GRANTS_READ_TIMEOUT: "22"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python src/update_grants.py \
            --input config/grants.yaml \
            --sources config/grants_sources.yaml \
            --contracts config/grants_evidence_contracts.yaml \
            --snapshots config/grants_snapshots.yaml \
            --discovery-baseline config/grants_discovery_baseline.yaml \
            --decisions config/grants_candidate_decisions.yaml \
            --output out/grants-verified-candidate.yaml \
            --snapshot-output out/grants-snapshots-candidate.yaml \
            --baseline-output out/grants-discovery-baseline-candidate.yaml \
            --evidence out/grants-evidence.json \
            --candidates out/grants-candidates.json \
            --coverage out/grants-source-coverage.json \
            --verified "${{ steps.when.outputs.verified }}"

      - name: Deterministic captured-evidence audit — no second network crawl
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s out/grants-verified-candidate.yaml
          python src/audit_grants.py \
            --grants out/grants-verified-candidate.yaml \
            --evidence out/grants-evidence.json \
            --candidates out/grants-candidates.json \
            --coverage out/grants-source-coverage.json \
            --verified "${{ steps.when.outputs.verified }}" \
            --output-json "${{ steps.when.outputs.audit_json }}" \
            --output-md "${{ steps.when.outputs.audit_md }}"

      - name: Upload verification evidence even on failure
        if: always() && steps.when.outputs.verified != '' && hashFiles('out/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: grants-radar-audit-${{ steps.when.outputs.verified }}
          path: |
            out/grants-verified-candidate.yaml
            out/grants-snapshots-candidate.yaml
            out/grants-discovery-baseline-candidate.yaml
            out/grants-evidence.json
            out/grants-candidates.json
            out/grants-source-coverage.json
            ${{ steps.when.outputs.audit_json }}
            ${{ steps.when.outputs.audit_md }}
          if-no-files-found: warn
          retention-days: 90

      - name: Hard factual publication gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.verify.outcome }}" = "success" || {
            echo "ERROR: official-source/snapshot verification or new-link reconciliation failed. PDF will NOT be generated or emailed."
            exit 1
          }
          test "${{ steps.audit.outcome }}" = "success" || {
            echo "ERROR: deterministic captured-evidence audit failed. PDF will NOT be generated or emailed."
            exit 1
          }
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("${{ steps.when.outputs.audit_json }}")
          d=json.loads(p.read_text())
          if not d.get("publishable"):
              raise SystemExit("ERROR: audit JSON is not publishable")
          print("Factual audit gate PASS")
          for k,v in d.get("gates",{}).items():
              print(k, "PASS" if v.get("pass") else "FAIL", "-", v.get("detail"))
          PY

      - name: Finalise verified canonical registry and evidence inventories
        shell: bash
        run: |
          set -euo pipefail
          cp out/grants-verified-candidate.yaml config/grants.yaml
          cp out/grants-snapshots-candidate.yaml config/grants_snapshots.yaml
          cp out/grants-discovery-baseline-candidate.yaml config/grants_discovery_baseline.yaml
          python - <<'PY'
          import hashlib, json, yaml
          from pathlib import Path
          audit_path=Path("${{ steps.when.outputs.audit_json }}")
          audit=json.loads(audit_path.read_text())
          p=Path("config/grants.yaml")
          d=yaml.safe_load(p.read_text()) or {}
          d.setdefault("metadata",{})
          d["metadata"].update({
              "verification_status":"PASS",
              "verified_date":audit["verified_date"],
              "audit_sha256":hashlib.sha256(audit_path.read_bytes()).hexdigest(),
              "registry_role":"canonical_source_of_truth_with_change_history",
              "verification_method":"zero_api_official_source_plus_fresh_snapshot_sentinels",
              "snapshot_freshness_days":45,
          })
          p.write_text(yaml.safe_dump(d,allow_unicode=True,sort_keys=False,width=120),encoding="utf-8")
          PY

      - name: Select approved layout reference
        id: layoutref
        shell: bash
        run: |
          set -euo pipefail
          APPROVED="assets/reference/radar-layout-reference.pdf"
          FALLBACK="assets/reference/radar-layout-reference-fallback.pdf"
          if test -s "$APPROVED"; then REF="$APPROVED"; else REF="$FALLBACK"; fi
          test -s "$REF"
          echo "reference=$REF" >> "$GITHUB_OUTPUT"

      - name: Build Grants & Accelerators Radar PDF
        shell: bash
        run: |
          set -euo pipefail
          python src/build_grants_pdf.py \
            config/grants.yaml \
            "${{ steps.when.outputs.ym }}" \
            --audit-report "${{ steps.when.outputs.audit_json }}" \
            --output "${{ steps.when.outputs.pdf }}" \
            --logo assets/gg-advisory-logo.png
          test -s "${{ steps.when.outputs.pdf }}"

      - name: Hard PDF layout continuity gate
        shell: bash
        run: |
          set -euo pipefail
          python src/check_pdf_layout.py \
            --reference "${{ steps.layoutref.outputs.reference }}" \
            --candidate "${{ steps.when.outputs.pdf }}" \
            --output-json "${{ steps.when.outputs.layout_json }}"

      - name: Upload final Radar PDF and layout audit
        uses: actions/upload-artifact@v4
        with:
          name: grants-radar-${{ steps.when.outputs.ym }}
          path: |
            ${{ steps.when.outputs.pdf }}
            ${{ steps.when.outputs.layout_json }}
          if-no-files-found: error
          retention-days: 90

      - name: Promote approved state and PDF reference
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/reference out
          cp "${{ steps.when.outputs.pdf }}" assets/reference/radar-layout-reference.pdf
          git config user.name "content-bot"
          git config user.email "content-bot@example.com"
          git add -f config/grants.yaml config/grants_snapshots.yaml config/grants_discovery_baseline.yaml assets/reference/radar-layout-reference.pdf
          git add -f "${{ steps.when.outputs.audit_json }}" "${{ steps.when.outputs.audit_md }}" "${{ steps.when.outputs.layout_json }}" "${{ steps.when.outputs.pdf }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "grants: verified radar ${{ steps.when.outputs.ym }}"
            git push origin HEAD:main
          fi

      - name: Email verified Grants & Accelerators Radar PDF only
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GG Advisory | Grants & Accelerators Radar (${{ steps.when.outputs.ym }})"
          from: "GG Advisory <${{ secrets.MAIL_USERNAME }}>"
          to: "a.demazy_de_fortet@icloud.com"
          body: |
            Verified Grants & Accelerators Radar attached.

            Publication gates passed:
            - every published programme passed the official-source/sentinel verification gate
            - temporary source blocking, if any, was bridged only by matching evidence snapshots no older than 45 days
            - every mandatory national/state/territory source group remained covered
            - every genuinely new high-signal discovery link was explicitly reconciled
            - registry continuity and change history passed
            - PDF layout continuity passed
            - paid model/API usage: zero
          attachments: |
            ${{ steps.when.outputs.pdf }}
