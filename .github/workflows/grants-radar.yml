name: grants-radar

on:
  # Manual only for now. Uncomment the schedule block when you want it automatic.
  # schedule:
  #   - cron: "10 0 1 * *" # 00:10 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      year:
        description: "Report year (e.g. 2026)"
        required: false
        default: ""
      month:
        description: "Report month (01..12)"
        required: false
        default: ""
      verified:
        description: "Optional verification date YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: grants-radar
  cancel-in-progress: false

jobs:
  build-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Radar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml reportlab

      - name: Resolve report month
        id: when
        shell: bash
        run: |
          set -euo pipefail

          IN_YEAR="${{ github.event.inputs.year || '' }}"
          IN_MONTH="${{ github.event.inputs.month || '' }}"
          IN_VERIFIED="${{ github.event.inputs.verified || '' }}"

          if [[ -n "$IN_YEAR" && -n "$IN_MONTH" ]]; then
            YM="$(printf "%04d-%02d" "$IN_YEAR" "$IN_MONTH")"
          else
            YM="$(TZ=Australia/Melbourne date +%Y-%m)"
          fi

          if [[ -n "$IN_VERIFIED" ]]; then
            VERIFIED="$IN_VERIFIED"
          else
            VERIFIED="$(TZ=Australia/Melbourne date +%Y-%m-%d)"
          fi

          MONTH_NAME="$(TZ=Australia/Melbourne date -d "${YM}-01" +%B-%Y)"
          OUT="out/Australia-Climate-Tech-Funding-Radar-${MONTH_NAME}-GG-Advisory.pdf"

          echo "ym=$YM" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

          echo "Report month: $YM"
          echo "Verification date: $VERIFIED"
          echo "Output: $OUT"

      - name: Build Grants & Accelerators Radar PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          python src/build_grants_pdf.py \
            config/grants.yaml \
            "${{ steps.when.outputs.ym }}" \
            --verified "${{ steps.when.outputs.verified }}" \
            --output "${{ steps.when.outputs.out }}" \
            --logo assets/gg-advisory-logo.png

          test -s "${{ steps.when.outputs.out }}"

      - name: Upload Radar artifact
        uses: actions/upload-artifact@v4
        with:
          name: grants-radar-${{ steps.when.outputs.ym }}
          path: ${{ steps.when.outputs.out }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit Radar PDF
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "content-bot"
          git config user.email "content-bot@example.com"
          git add -f "${{ steps.when.outputs.out }}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "grants: funding radar ${{ steps.when.outputs.ym }}"
            git push origin HEAD:main
          fi

      - name: Email Grants & Accelerators Radar PDF
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GG Advisory | Grants & Accelerators Radar (${{ steps.when.outputs.ym }})"
          from: "GG Advisory <${{ secrets.MAIL_USERNAME }}>"
          to: "a.demazy_de_fortet@icloud.com"
          body: |
            Grants & Accelerators Radar for ${{ steps.when.outputs.ym }} attached.

            This workflow generates the branded PDF only.
          attachments: |
            ${{ steps.when.outputs.out }}
